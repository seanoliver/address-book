name: Deploy staging database

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: staging-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate staging
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Apply committed migrations to staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "STAGING_DATABASE_URL is not configured"; exit 1; }
          # Use the IPv4 session pooler. Transaction pooling retains prepared
          # statements across CLI clients and can fail retries with SQLSTATE 42P05.
          MIGRATION_DATABASE_URL="${DATABASE_URL/.pooler.supabase.com:6543/.pooler.supabase.com:5432}"
          [[ "$MIGRATION_DATABASE_URL" == *".pooler.supabase.com:5432/"* ]] || {
            echo "STAGING_DATABASE_URL must use the Supabase session pooler"; exit 1;
          }
          supabase db push --db-url "$MIGRATION_DATABASE_URL" --include-all --yes
