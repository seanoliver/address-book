name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tested commit SHA or tag to deploy
        required: true
        default: main

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: pnpm install --frozen-lockfile
      - name: Install Vercel CLI
        run: pnpm add --global vercel@49.1.2
      - name: Apply committed migrations to production
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "PRODUCTION_DATABASE_URL is not configured"; exit 1; }
          # The transaction pooler (6543) retains prepared statements across
          # clients; Supabase CLI migration retries then fail with SQLSTATE 42P05.
          MIGRATION_DATABASE_URL="${DATABASE_URL/.pooler.supabase.com:6543/.pooler.supabase.com:5432}"
          [[ "$MIGRATION_DATABASE_URL" == *".pooler.supabase.com:5432/"* ]] || {
            echo "PRODUCTION_DATABASE_URL must use the Supabase session pooler"; exit 1;
          }
          supabase db push --db-url "$MIGRATION_DATABASE_URL" --include-all --yes
      - name: Pull production Vercel settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      - name: Build production artifact
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      - name: Deploy tested artifact
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
